refresh:
  fields:
    source:
      required: false
      selector:
        select:
          options:
            - adsb_fi
            - adsb_lol
            - adsb_com

center_map:
  fields:
    latitude:
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: 0.001
    longitude:
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: 0.001
    zoom:
      required: false
      selector:
        number:
          min: 1
          max: 18
          step: 1

get_flight_image:
  fields:
    callsign:
      required: false
      selector:
        text:
    registration:
      required: false
      selector:
        text:
    icao24:
      required: false
      selector:
        text:

set_search_params:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: flight_tracker
    latitude:
      required: false
      selector:
        number:
          min: -90
          max: 90
          step: 0.001
    longitude:
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: 0.001
    radius_km:
      required: false
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: km
    min_altitude:
      required: false
      selector:
        number:
          min: 0
          max: 60000
          step: 100
          unit_of_measurement: ft
    max_altitude:
      required: false
      selector:
        number:
          min: 0
          max: 60000
          step: 100
          unit_of_measurement: ft
    track_military:
      required: false
      selector:
        boolean:
    track_ga:
      required: false
      selector:
        boolean:
