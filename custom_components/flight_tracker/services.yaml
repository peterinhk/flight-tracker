refresh:
  fields:
    source:
      required: false
      selector:
        select:
          options:
            - adsb_fi
            - adsb_lol
            - adsb_com

center_map:
  fields:
    latitude:
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: 0.0001
    longitude:
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: 0.0001
    zoom:
      required: false
      selector:
        number:
          min: 1
          max: 18
          step: 1

get_flight_image:
  fields:
    callsign:
      required: false
      selector:
        text:
    registration:
      required: false
      selector:
        text:
    icao24:
      required: false
      selector:
        text:
